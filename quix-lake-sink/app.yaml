name: duckdb-s3-sink
language: python
variables:
  - name: input
    inputType: InputTopic
    description: Name of the Kafka input topic to consume from
    defaultValue: sensor-data
    required: true
  - name: S3_BUCKET
    inputType: FreeText
    description: S3 bucket name for storing Parquet files
    required: true
  - name: S3_PREFIX
    inputType: FreeText
    description: S3 prefix/path for data files
    defaultValue: data
    required: false
  - name: TABLE_NAME
    inputType: FreeText
    description: Table name for data organization and registration
    defaultValue: data
    required: false
  - name: HIVE_COLUMNS
    inputType: FreeText
    description: Comma-separated list of columns for Hive partitioning. Include year/month/day/hour to extract from TIMESTAMP_COLUMN (e.g., location,year,month,day,sensor_type)
    defaultValue: ""
    required: false
  - name: TIMESTAMP_COLUMN
    inputType: FreeText
    description: Column containing timestamp values to extract year/month/day/hour from
    defaultValue: ts_ms
    required: false
  - name: TIMESTAMP_FORMAT
    inputType: FreeText
    description: No longer used - specify time columns directly in HIVE_COLUMNS
    defaultValue: day
    required: false
  - name: CATALOG_URL
    inputType: FreeText
    description: REST Catalog URL for optional table registration (leave empty to skip)
    defaultValue: http://iceberg-rest-catalog:5001
    required: false
  - name: AUTO_DISCOVER
    inputType: FreeText
    description: Automatically register table in REST Catalog on first write
    defaultValue: "true"
    required: false
  - name: CATALOG_NAMESPACE
    inputType: FreeText
    description: Catalog namespace for table registration
    defaultValue: default
    required: false
  - name: BATCH_SIZE
    inputType: FreeText
    description: Number of messages to batch before writing to S3
    defaultValue: "1000"
    required: false
  - name: COMMIT_INTERVAL
    inputType: FreeText
    description: Kafka commit interval in seconds
    defaultValue: "30"
    required: false
  - name: CONSUMER_GROUP
    inputType: FreeText
    description: Kafka consumer group name
    defaultValue: s3_direct_sink_v1.0
    required: false
  - name: AUTO_OFFSET_RESET
    inputType: FreeText
    description: Where to start consuming if no offset exists
    defaultValue: latest
    required: false
  - name: AWS_ACCESS_KEY_ID
    inputType: Secret
    description: AWS Access Key ID for S3 access
    required: false
    defaultValue: ""
  - name: AWS_SECRET_ACCESS_KEY
    inputType: Secret
    description: AWS Secret Access Key for S3 access
    required: false
  - name: AWS_REGION
    inputType: FreeText
    description: AWS region for S3 bucket
    defaultValue: us-east-1
    required: false
dockerfile: dockerfile
runEntryPoint: main.py
defaultFile: main.py
libraryItemId: starter-destination