# Quix Project Descriptor
# This file describes the data pipeline and configuration of resources of a Quix Project.

metadata:
  version: 1.0

# This section describes the Deployments of the data pipeline
deployments:
  - name: QuixLake API
    application: quix-lake-api
    version: latest
    deploymentType: Service
    resources:
      cpu: 200
      memory: 1000
      replicas: 1
    publicAccess:
      enabled: true
      urlPrefix: quixlake
    state:
      enabled: true
      size: 1
    variables:
      - name: S3_BUCKET
        inputType: FreeText
        description: S3 bucket name for QuixLake data storage (REQUIRED)
        value: quix-test-bucket
      - name: S3_PREFIX
        inputType: FreeText
        description: S3 prefix/folder for data objects
        value: iceberg
      - name: AWS_REGION
        inputType: FreeText
        description: AWS region for S3 bucket
        value: eu-west-2
      - name: CATALOG_URL
        inputType: FreeText
        description: REST Catalog service URL
        value: http://iceberg-catalog:80
      - name: AWS_ACCESS_KEY_ID
        inputType: Secret
        description: AWS Access Key ID (leave empty to use IAM roles)
        secretKey: AWS_ACCESS_KEY_ID
      - name: AWS_SECRET_ACCESS_KEY
        inputType: Secret
        description: AWS Secret Access Key (leave empty to use IAM roles)
        secretKey: AWS_SECRET_ACCESS_KEY
  - name: Query UI
    application: sql-query-ui
    version: latest
    deploymentType: Service
    resources:
      cpu: 200
      memory: 500
      replicas: 1
    publicAccess:
      enabled: true
      urlPrefix: query-ui
    variables:
      - name: QUERY_API_URL
        inputType: FreeText
        description: URL of the DuckDB Query API service to connect to
        required: true
        value: iceberg-catalog:5001
  - name: iceberg-rest-catalog
    application: iceberg-rest-catalog
    version: latest
    deploymentType: Service
    resources:
      cpu: 200
      memory: 500
      replicas: 1
    publicAccess:
      enabled: true
      urlPrefix: iceberg-catalog
    state:
      enabled: true
      size: 1
    network:
      serviceName: iceberg-catalog
      ports:
        - port: 80
          targetPort: 5001
    variables:
      - name: S3_BUCKET
        inputType: FreeText
        description: S3 bucket name for QuixLake data and catalog storage
        value: quix-test-bucket
      - name: S3_PREFIX
        inputType: FreeText
        description: S3 prefix/folder for data objects
        value: data
      - name: CATALOG_PREFIX
        inputType: FreeText
        description: S3 prefix/folder for catalog metadata
        value: catalog
      - name: AWS_REGION
        inputType: FreeText
        description: AWS region for S3 bucket
        value: eu-west-2
      - name: PORT
        inputType: FreeText
        description: Port for the REST catalog service
        value: 5001
      - name: AWS_ACCESS_KEY_ID
        inputType: Secret
        description: AWS Access Key ID (leave empty to use IAM roles)
        secretKey: AWS_ACCESS_KEY_ID
      - name: AWS_SECRET_ACCESS_KEY
        inputType: Secret
        description: AWS Secret Access Key (leave empty to use IAM roles)
        secretKey: AWS_SECRET_ACCESS_KEY
      - name: POSTGRES_HOST
        inputType: FreeText
        description: PostgreSQL host address
        value: postgresql
      - name: POSTGRES_PORT
        inputType: FreeText
        description: PostgreSQL port
        value: 80
      - name: POSTGRES_DB
        inputType: FreeText
        description: PostgreSQL database name
        value: iceberg_catalog
      - name: POSTGRES_USER
        inputType: FreeText
        description: PostgreSQL username
        value: admin
      - name: POSTGRES_PASSWORD
        inputType: Secret
        description: PostgreSQL password
        secretKey: postgres_password
      - name: CATALOG_BACKEND
        inputType: FreeText
        required: true
        value: postgres
  - name: postgreSQL
    application: postgresql
    version: latest
    deploymentType: Service
    resources:
      cpu: 200
      memory: 2000
      replicas: 1
    state:
      enabled: true
      size: 10
    network:
      serviceName: postgresql
      ports:
        - port: 80
          targetPort: 5432
    variables:
      - name: POSTGRES_USER
        inputType: FreeText
        description: The root username to initialize PostgreSQL with
        required: true
        value: admin
      - name: POSTGRES_PASSWORD
        inputType: Secret
        description: The root password to initialize MongoDB with
        required: true
        secretKey: postgres_password
      - name: POSTGRES_DB
        inputType: FreeText
        description: The default database name to initialize PostgreSQL with
        required: true
        value: quix

# This section describes the Topics of the data pipeline
topics:
  - name: tsbs_data
