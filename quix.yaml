# Quix Project Descriptor
# This file describes the data pipeline and configuration of resources of a Quix Project.

metadata:
  version: 1.0

# This section describes the Deployments of the data pipeline
deployments:
  - name: QuixLake API
    application: quix-lake-api
    version: latest
    deploymentType: Service
    resources:
      cpu: 200
      memory: 1000
      replicas: 1
    publicAccess:
      enabled: true
      urlPrefix: quixlake
    state:
      enabled: true
      size: 1
    variables:
      - name: S3_BUCKET
        inputType: FreeText
        description: S3 bucket name for QuixLake data storage (REQUIRED)
        value: quix-bucket
      - name: S3_PREFIX
        inputType: FreeText
        description: S3 prefix/folder for data objects
        value: quixlake
      - name: AWS_REGION
        inputType: FreeText
        description: AWS region for S3 bucket
        value: local
      - name: CATALOG_URL
        inputType: FreeText
        description: REST Catalog service URL
        value: http://iceberg-catalog:80
      - name: AWS_ACCESS_KEY_ID
        inputType: Secret
        description: AWS Access Key ID (leave empty to use IAM roles)
        secretKey: aws_access_key_id
      - name: AWS_SECRET_ACCESS_KEY
        inputType: Secret
        description: AWS Secret Access Key (leave empty to use IAM roles)
        secretKey: aws_secret_access_key
      - name: AWS_ENDPOINT_URL
        inputType: FreeText
        description: S3 endpoint url (for non-AWS endpoints)
        value: http://minio:9000
  - name: Query UI
    application: sql-query-ui
    version: latest
    deploymentType: Service
    resources:
      cpu: 200
      memory: 500
      replicas: 1
    publicAccess:
      enabled: true
      urlPrefix: query-ui
    variables:
      - name: QUERY_API_URL
        inputType: FreeText
        description: URL of the DuckDB Query API service to connect to
        required: true
        value: http://iceberg-catalog:80
  - name: iceberg-rest-catalog
    application: iceberg-rest-catalog
    version: latest
    deploymentType: Service
    resources:
      cpu: 200
      memory: 500
      replicas: 1
    publicAccess:
      enabled: true
      urlPrefix: iceberg-catalog
    state:
      enabled: true
      size: 1
    network:
      serviceName: iceberg-catalog
      ports:
        - port: 80
          targetPort: 5001
    variables:
      - name: S3_BUCKET
        inputType: FreeText
        description: S3 bucket name for QuixLake data and catalog storage
        value: quix-bucket
      - name: S3_PREFIX
        inputType: FreeText
        description: S3 prefix/folder for data objects
        value: quixlake
      - name: CATALOG_PREFIX
        inputType: FreeText
        description: S3 prefix/folder for catalog metadata
        value: catalog
      - name: AWS_REGION
        inputType: FreeText
        description: AWS region for S3 bucket
        value: local
      - name: PORT
        inputType: FreeText
        description: Port for the REST catalog service
        value: 5001
      - name: AWS_ACCESS_KEY_ID
        inputType: Secret
        description: AWS Access Key ID (leave empty to use IAM roles)
        secretKey: aws_access_key_id
      - name: AWS_SECRET_ACCESS_KEY
        inputType: Secret
        description: AWS Secret Access Key (leave empty to use IAM roles)
        secretKey: aws_secret_access_key
      - name: AWS_ENDPOINT_URL
        inputType: FreeText
        description: S3 endpoint url (for non-AWS endpoints)
        value: http://minio:9000
      - name: POSTGRES_HOST
        inputType: FreeText
        description: PostgreSQL host address
        value: postgresql
      - name: POSTGRES_PORT
        inputType: FreeText
        description: PostgreSQL port
        value: 80
      - name: POSTGRES_DB
        inputType: FreeText
        description: PostgreSQL database name
        value: iceberg_catalog
      - name: POSTGRES_USER
        inputType: FreeText
        description: PostgreSQL username
        value: admin
      - name: POSTGRES_PASSWORD
        inputType: Secret
        description: PostgreSQL password
        secretKey: postgres_password
      - name: CATALOG_BACKEND
        inputType: FreeText
        required: true
        value: postgres
  - name: postgreSQL
    application: postgresql
    version: latest
    deploymentType: Service
    resources:
      cpu: 200
      memory: 2000
      replicas: 1
    state:
      enabled: true
      size: 10
    network:
      serviceName: postgresql
      ports:
        - port: 80
          targetPort: 5432
    variables:
      - name: POSTGRES_USER
        inputType: FreeText
        description: The root username to initialize PostgreSQL with
        required: true
        value: admin
      - name: POSTGRES_PASSWORD
        inputType: Secret
        description: The root password to initialize MongoDB with
        required: true
        secretKey: postgres_password
      - name: POSTGRES_DB
        inputType: FreeText
        description: The default database name to initialize PostgreSQL with
        required: true
        value: quix
  - name: TSBS Quix Data Generator
    application: tsbs-quix-data-generator
    version: latest
    deploymentType: Job
    resources:
      cpu: 200
      memory: 1000
      replicas: 1
    variables:
      - name: output
        inputType: OutputTopic
        description: This is the Quix Topic that will receive the generated data
        required: true
        value: tsbs_data
      - name: TSBS_USE_CASE
        inputType: FreeText
        description: 'The type of data; options: cpu-only, devops, iot'
        required: true
        value: cpu-only
      - name: TSBS_SEED
        inputType: FreeText
        description: 'an integer PRNG seed for deterministic generation. '
        required: true
        value: 123
      - name: TSBS_SCALE
        inputType: FreeText
        description: The number of devices / trucks to generate data for
        required: true
        value: 5
      - name: TSBS_TIMESTAMP_START
        inputType: FreeText
        description: A start time for the data's timestamps, formatted as Y-M-DTH:M:SZ
        required: true
        value: 2025-01-07T00:00:00Z
      - name: TSBS_TIMESTAMP_END
        inputType: FreeText
        description: The end time for the data's timestamps, formatted as Y-M-DTH:M:SZ
        required: true
        value: 2025-01-08T00:00:00Z
      - name: TSBS_LOG_INTERVAL
        inputType: FreeText
        description: how much time should be between each reading per device, formatted as Nt
        required: true
        value: 10s
  - name: minio
    application: minio
    version: latest
    deploymentType: Service
    resources:
      cpu: 200
      memory: 500
      replicas: 1
    publicAccess:
      enabled: true
      urlPrefix: minio
    state:
      enabled: true
      size: 5
    network:
      serviceName: minio
      ports:
        - port: 80
          targetPort: 9001
        - port: 9000
          targetPort: 9000
    variables:
      - name: MINIO_ROOT_USER
        inputType: FreeText
        description: The root username to initialize Minio with
        required: true
        value: admin
      - name: MINIO_ROOT_PASSWORD
        inputType: Secret
        description: The root password to initialize MongoDB with
        required: true
        secretKey: minio_password
  - name: QuixLake sink
    application: quix-lake-sink
    version: latest
    deploymentType: Service
    resources:
      cpu: 200
      memory: 500
      replicas: 1
    variables:
      - name: input
        inputType: InputTopic
        description: Name of the Kafka input topic to consume from
        required: true
        value: tsbs_data_transformed
      - name: S3_BUCKET
        inputType: FreeText
        description: S3 bucket name for storing Parquet files
        required: true
        value: quix-bucket
      - name: S3_PREFIX
        inputType: FreeText
        description: S3 prefix/path for data files
        value: quixlake
      - name: TABLE_NAME
        inputType: FreeText
        description: Table name for data organization and registration
        value: cpu-metrics
      - name: HIVE_COLUMNS
        inputType: FreeText
        description: Comma-separated list of columns for Hive partitioning. Include year/month/day/hour to extract from TIMESTAMP_COLUMN (e.g., location,year,month,day,sensor_type)
        value: region,datacenter,hostname,year,month,day,hour
      - name: TIMESTAMP_COLUMN
        inputType: FreeText
        description: Column containing timestamp values to extract year/month/day/hour from
        value: timestamp
      - name: CATALOG_URL
        inputType: FreeText
        description: REST Catalog URL for optional table registration (leave empty to skip)
        value: http://iceberg-catalog:80
      - name: AUTO_DISCOVER
        inputType: FreeText
        description: Automatically register table in REST Catalog on first write
        value: true
      - name: CATALOG_NAMESPACE
        inputType: FreeText
        description: Catalog namespace for table registration
        value: default
      - name: BATCH_SIZE
        inputType: FreeText
        description: Number of messages to batch before writing to S3
        value: 1000
      - name: COMMIT_INTERVAL
        inputType: FreeText
        description: Kafka commit interval in seconds
        value: 30
      - name: CONSUMER_GROUP
        inputType: FreeText
        description: Kafka consumer group name
        value: tsbs_s3_sink
      - name: AUTO_OFFSET_RESET
        inputType: FreeText
        description: Where to start consuming if no offset exists
        value: earliest
      - name: AWS_ACCESS_KEY_ID
        inputType: Secret
        description: AWS Access Key ID for S3 access
        secretKey: aws_access_key_id
      - name: AWS_SECRET_ACCESS_KEY
        inputType: Secret
        description: AWS Secret Access Key for S3 access
        secretKey: aws_secret_access_key
      - name: AWS_REGION
        inputType: FreeText
        description: AWS region for S3 bucket
        value: local
      - name: AWS_ENDPOINT_URL
        inputType: FreeText
        description: S3 endpoint url (for non-AWS endpoints)
        value: http://minio:9000
  - name: TSBS Transformer
    application: tsbs-transformer
    version: latest
    deploymentType: Service
    resources:
      cpu: 200
      memory: 500
      replicas: 1
    variables:
      - name: input
        inputType: InputTopic
        description: Name of the input topic to listen to.
        value: tsbs_data
      - name: output
        inputType: OutputTopic
        description: Name of the output topic to write to.
        value: tsbs_data_transformed

# This section describes the Topics of the data pipeline
topics:
  - name: tsbs_data
  - name: tsbs_data_transformed
  - name: tsbs_data_transformed_000
