<!DOCTYPE html>
<html>
<head>
    <title>Test Explain UI</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .query-box { margin: 20px 0; }
        textarea { width: 100%; height: 100px; font-family: monospace; }
        .options { margin: 10px 0; }
        button { padding: 8px 16px; background: #1a73e8; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #1557b0; }
        .results { margin-top: 20px; border: 1px solid #ddd; padding: 10px; }
        .explain-output { background: #f8f9fa; padding: 15px; font-family: monospace; white-space: pre; overflow-x: auto; }
        .error { color: #d93025; }
        .success { color: #188038; }
        pre { margin: 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Test Explain UI Functionality</h1>
        
        <div class="query-box">
            <h3>SQL Query:</h3>
            <textarea id="query">SELECT sensor_id, COUNT(*) as count 
FROM perf_test 
GROUP BY sensor_id 
ORDER BY count DESC 
LIMIT 5</textarea>
            
            <div class="options">
                <label>
                    <input type="checkbox" id="explain" checked> Show Execution Plan
                </label>
            </div>
            
            <button onclick="runQuery()">Run Query</button>
        </div>
        
        <div id="results" class="results" style="display: none;">
            <h3>Results:</h3>
            <div id="status"></div>
            <h4>Query Data:</h4>
            <pre id="data"></pre>
            <h4>Execution Plan:</h4>
            <div id="explain" class="explain-output"></div>
        </div>
    </div>

    <script>
        async function runQuery() {
            const query = document.getElementById('query').value;
            const useExplain = document.getElementById('explain').checked;
            const resultsDiv = document.getElementById('results');
            const statusDiv = document.getElementById('status');
            const dataDiv = document.getElementById('data');
            const explainDiv = document.getElementById('explain');
            
            resultsDiv.style.display = 'block';
            statusDiv.textContent = 'Running query...';
            statusDiv.className = '';
            
            try {
                const url = 'http://localhost:80/query' + (useExplain ? '?explain=true' : '');
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: query
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const contentType = response.headers.get('content-type');
                
                if (contentType && contentType.includes('application/json')) {
                    // JSON response with explain
                    const result = await response.json();
                    statusDiv.textContent = '✓ Query executed successfully (with explain)';
                    statusDiv.className = 'success';
                    
                    dataDiv.textContent = result.data || 'No data';
                    
                    if (result.explain) {
                        explainDiv.style.display = 'block';
                        explainDiv.textContent = result.explain;
                    } else {
                        explainDiv.style.display = 'none';
                    }
                } else {
                    // Plain CSV response
                    const result = await response.text();
                    statusDiv.textContent = '✓ Query executed successfully';
                    statusDiv.className = 'success';
                    
                    dataDiv.textContent = result;
                    explainDiv.style.display = 'none';
                }
                
            } catch (error) {
                statusDiv.textContent = '✗ Error: ' + error.message;
                statusDiv.className = 'error';
                dataDiv.textContent = '';
                explainDiv.textContent = '';
            }
        }
    </script>
</body>
</html>
