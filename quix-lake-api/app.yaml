name: quix-lake-api
language: python
variables:
  # S3 Storage Configuration (Required)
  - name: S3_BUCKET
    inputType: FreeText
    multiline: false
    defaultValue: quixlake-data
    description: "S3 bucket name for QuixLake data storage (REQUIRED)"
  - name: S3_PREFIX
    inputType: FreeText
    multiline: false
    defaultValue: data
    description: "S3 prefix/folder for data objects"
  - name: AWS_REGION
    inputType: FreeText
    multiline: false
    defaultValue: us-east-1
    description: "AWS region for S3 bucket"
  
  # Catalog Configuration
  - name: CATALOG_URL
    inputType: FreeText
    multiline: false
    defaultValue: "http://iceberg-rest-catalog:5001"
    description: "REST Catalog service URL"
  
  # AWS Authentication (Optional - use IAM roles when possible)
  - name: AWS_ACCESS_KEY_ID
    inputType: Secret
    multiline: false
    defaultValue: ""
    description: "AWS Access Key ID (leave empty to use IAM roles)"
  - name: AWS_SECRET_ACCESS_KEY
    inputType: Secret
    multiline: false
    defaultValue: ""
    description: "AWS Secret Access Key (leave empty to use IAM roles)"

dockerfile: dockerfile
runEntryPoint: main.py
defaultFile: main.py
