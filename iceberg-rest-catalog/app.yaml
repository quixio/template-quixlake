name: iceberg-rest-catalog
language: python
variables:
  - name: CATALOG_PREFIX
    inputType: FreeText
    multiline: false
    description: S3 prefix/folder for catalog metadata
    defaultValue: catalog
  - name: PORT
    inputType: FreeText
    multiline: false
    description: Port for the REST catalog service
    defaultValue: 5001
  - name: S3_BUCKET
    inputType: FreeText
    multiline: false
    description: S3 bucket name for QuixLake data and catalog storage
    defaultValue: quix-test-bucket
  - name: S3_PREFIX
    inputType: FreeText
    multiline: false
    description: S3 prefix/folder for data objects
    defaultValue: data
  - name: AWS_ACCESS_KEY_ID
    inputType: Secret
    multiline: false
    description: AWS Access Key ID (leave empty to use IAM roles)
  - name: AWS_SECRET_ACCESS_KEY
    inputType: Secret
    multiline: false
    description: AWS Secret Access Key (leave empty to use IAM roles)
  - name: AWS_REGION
    inputType: FreeText
    multiline: false
    description: AWS region for S3 bucket
    defaultValue: eu-west-2
  - name: AWS_ENDPOINT_URL
    inputType: FreeText
    description: S3 endpoint url (for non-AWS endpoints)
    required: false
  - name: POSTGRES_HOST
    inputType: FreeText
    multiline: false
    description: PostgreSQL host address
  - name: POSTGRES_PORT
    inputType: FreeText
    multiline: false
    description: PostgreSQL port
    defaultValue: 5432
  - name: POSTGRES_DB
    inputType: FreeText
    multiline: false
    description: PostgreSQL database name
    defaultValue: iceberg_catalog
  - name: POSTGRES_USER
    inputType: FreeText
    multiline: false
    description: PostgreSQL username
    defaultValue: postgres
  - name: POSTGRES_PASSWORD
    inputType: Secret
    multiline: false
    description: PostgreSQL password
  - name: CATALOG_BACKEND
    inputType: FreeText
    multiline: false
    defaultValue: postgres
    required: true
dockerfile: dockerfile
runEntryPoint: main.py
defaultFile: main.py
